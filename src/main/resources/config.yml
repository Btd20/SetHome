# Default permission config
requires-default-permission: false
default-permission: "sethome.use"

# Regular expression to validate home names.
# By default: Allows letters (A-Z, a-z), numbers (0-9), and spaces (\s). Minimum 1 character, maximum 32.
name-regex: "^[A-Za-z0-9\\s]{1,32}$"

# Default max homes config.
# Set to -1 for unlimited homes.
default-max-homes: 3

# Teleporting config.
teleport-cooldown: 5
cancel-on-move: true

# List of disabled worlds.
blacklisted-worlds:
  - example_world1
  - example_world2

# List of disabled words.
blacklisted-words:
  - exampleword1
  - exampleword2

