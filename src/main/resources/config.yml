# ==========================================================================
#                        DATA STORAGE / DATABASES
# ==========================================================================
# Where all player data (homes) is stored.
#
#   YAML  -> One file per player in /data. Default. No setup required.
#   MYSQL -> MySQL or MariaDB server with normalized tables. Recommended for
#            networks (BungeeCord/Velocity) where several servers share homes.
#
# If MySQL is enabled but cannot be reached, the plugin logs the error and
# keeps running on local YAML files instead of breaking.
#
# NOTE: changes in this section require a FULL SERVER RESTART.
# /homeadmin reload does not reopen database connections.
storage:
  type: YAML

  # Copies every existing /data/*.yml into the external backend on startup.
  # Turn it on once after switching to MYSQL, then set it back to false.
  migrate-from-yaml: false

  mysql:
    host: localhost
    port: 3306
    database: sethomegui
    username: root
    password: ""

    # Prefix for the plugin tables (<prefix>players, <prefix>homes,
    # <prefix>home_access, <prefix>friends). Only letters, numbers and _.
    table-prefix: "sethomegui_"

    # Maximum simultaneous connections and connection timeout in milliseconds.
    pool-size: 10
    connection-timeout: 10000

    # Extra parameters appended to the JDBC URL.
    properties:
      useSSL: false
      characterEncoding: utf8
      autoReconnect: true

  # Optional layer ON TOP of MySQL (it is ignored when type is YAML).
  # Redis does not replace the database: it caches reads and instantly tells
  # the other servers of the network when a player's data changes, so nobody
  # keeps serving outdated homes from memory.
  redis:
    enabled: false
    host: localhost
    port: 6379
    password: ""
    database: 0
    ssl: false
    timeout: 2000
    pool-size: 8

    # How long a cached copy survives in Redis, in seconds.
    cache-seconds: 300

    # Unique name for THIS server. Two servers must never share the same id,
    # otherwise they will ignore each other's synchronization messages.
    server-id: "server-1"

    key-prefix: "sethomegui:player:"

# Default permission config
requires-default-permission: false
default-permission: "sethome.use"

# Regular expression to validate home names.
# By default: Allows letters (A-Z, a-z), numbers (0-9), and spaces (\s). Minimum 1 character, maximum 32.
name-regex: "^[A-Za-z0-9\\s]{1,32}$"

# Default max homes config.
# Set to -1 for unlimited homes.
default-max-homes: 3

# Time in seconds that a player has to type the home name in chat before the process automatically expires.
chat-prompt-timeout: 60

# Teleporting config.
teleport-cooldown: 5
cancel-on-move: true

# List of disabled worlds.
blacklisted-worlds:
  - example_world1
  - example_world2

# List of disabled words.
blacklisted-words:
  - exampleword1
  - exampleword2

